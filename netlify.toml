# Netlify Configuration for Syntech Digitals

[build]
  publish = "."

# Cache control: serve latest content.json without stale cache
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Static assets: long cache
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Identity redirect for CMS
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
