# ============================================================
# DECAP CMS — Syntech Digitals (Page-wise Structure)
# ============================================================
# Setup: Netlify → Identity → Enable → Invite users → Git Gateway
# Admin URL: yourdomain.netlify.app/admin
# ============================================================

backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Website Pages"
    files:

      # ---- SITE SETTINGS ----
      - name: "site_settings"
        label: "🌐 Site Settings"
        file: "content/site.json"
        format: json
        description: "Global settings: phone number, email, social media links, footer text"
        fields:
          - label: "Contact & Brand Info"
            name: "site"
            widget: "object"
            fields:
              - { label: "Agency Name", name: "name", widget: "string", hint: "Displayed in logo and browser tab" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Phone Number", name: "phone", widget: "string", hint: "e.g. +91 98765 43210" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Office Address", name: "address", widget: "string" }
              - { label: "WhatsApp Number", name: "whatsapp", widget: "string", hint: "Country code + number, no spaces. e.g. 919876543210" }
              - { label: "Facebook URL", name: "social_fb", widget: "string", required: false }
              - { label: "Twitter / X URL", name: "social_tw", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "social_li", widget: "string", required: false }
              - { label: "Instagram URL", name: "social_ig", widget: "string", required: false }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Footer Description", name: "description", widget: "text", hint: "Short paragraph shown in footer" }
              - { label: "Copyright Text", name: "copyright", widget: "string", hint: "e.g. 2025 Syntech Digitals. All rights reserved." }

      # ---- HOME PAGE ----
      - name: "home_page"
        label: "🏠 Home Page"
        file: "content/home.json"
        format: json
        description: "Edit testimonials / client reviews shown on the home page"
        fields:
          - label: "Client Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Avatar Initials (2 letters)", name: "initials", widget: "string", hint: "e.g. RS for Rajesh Sharma", pattern: ['.{1,3}', "Max 3 characters"] }
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Role / Company", name: "role", widget: "string", hint: "e.g. CEO, TechStartup India" }
              - { label: "Review Text", name: "text", widget: "text" }
              - { label: "Star Rating", name: "rating", widget: "number", min: 1, max: 5, default: 5 }

      # ---- PACKAGES PAGE ----
      - name: "packages_page"
        label: "💰 Packages & Pricing"
        file: "content/packages.json"
        format: json
        description: "Edit all pricing packages — SEO Starter, SEO Super, Website Packages, and FAQ"
        fields:

          - label: "SEO Starter Packages"
            name: "seo_starter"
            widget: "object"
            fields:
              - label: "Plans"
                name: "plans"
                widget: "list"
                summary: "{{fields.name}} — ₹{{fields.price}}/{{fields.period}}"
                fields:
                  - { label: "Plan Name", name: "name", widget: "string" }
                  - { label: "Price (numbers only, no ₹)", name: "price", widget: "string", hint: "e.g. 8,000" }
                  - { label: "Period", name: "period", widget: "string", default: "month", hint: "e.g. month or one-time" }
                  - { label: "Short Description", name: "desc", widget: "string" }
                  - { label: "Badge (e.g. Most Popular — leave blank for none)", name: "badge", widget: "string", required: false }
                  - { label: "Button Text", name: "cta", widget: "string", default: "Get Started" }
                  - label: "Features List"
                    name: "features"
                    widget: "list"
                    summary: "{{fields.included}} — {{fields.text}}"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
                      - { label: "Included (tick) or Not Included (cross)?", name: "included", widget: "boolean", default: true }

          - label: "SEO Super Packages (SEO + Social Media)"
            name: "seo_super"
            widget: "object"
            fields:
              - label: "Plans"
                name: "plans"
                widget: "list"
                summary: "{{fields.name}} — ₹{{fields.price}}/{{fields.period}}"
                fields:
                  - { label: "Plan Name", name: "name", widget: "string" }
                  - { label: "Price (numbers only, no ₹)", name: "price", widget: "string", hint: "e.g. 22,000" }
                  - { label: "Period", name: "period", widget: "string", default: "month" }
                  - { label: "Short Description", name: "desc", widget: "string" }
                  - { label: "Badge (e.g. Best Value — leave blank for none)", name: "badge", widget: "string", required: false }
                  - { label: "Button Text", name: "cta", widget: "string", default: "Get Started" }
                  - label: "Features List"
                    name: "features"
                    widget: "list"
                    summary: "{{fields.included}} — {{fields.text}}"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
                      - { label: "Included?", name: "included", widget: "boolean", default: true }

          - label: "Website Packages"
            name: "website"
            widget: "object"
            fields:
              - label: "Plans"
                name: "plans"
                widget: "list"
                summary: "{{fields.name}} — ₹{{fields.price}}"
                fields:
                  - { label: "Plan Name", name: "name", widget: "string" }
                  - { label: "Price (numbers only, no ₹)", name: "price", widget: "string", hint: "e.g. 12,000" }
                  - { label: "Period", name: "period", widget: "string", default: "one-time" }
                  - { label: "Short Description", name: "desc", widget: "string" }
                  - { label: "Badge (e.g. Most Popular — leave blank for none)", name: "badge", widget: "string", required: false }
                  - { label: "Button Text", name: "cta", widget: "string", default: "Get Started" }
                  - label: "Features List"
                    name: "features"
                    widget: "list"
                    summary: "{{fields.included}} — {{fields.text}}"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
                      - { label: "Included?", name: "included", widget: "boolean", default: true }

          - label: "FAQ"
            name: "faq"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Answer", name: "a", widget: "text" }
